name: Forward CIATA changes to Forgejo

# This is deliberately a one-way proposal workflow. It can publish a branch
# and open/update a PR on Forgejo, but it never merges the PR or publishes a
# release. The existing FORGEJO_TOKEN secret is reused for the API and push.
on:
  push:
    branches:
      - "ciata/**"
  workflow_dispatch:
    inputs:
      source_branch:
        description: GitHub branch containing the CIATA changes
        required: true
        type: string
      target_branch:
        description: Forgejo branch that should receive the PR
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: forward-ciata-pr-${{ inputs.source_branch || github.ref_name }}
  cancel-in-progress: true

env:
  FORGEJO_BASE: https://git.serrebiradio.com
  FORGEJO_OWNER: serrebi
  FORGEJO_REPO: Accessible-IPTV-Client
  SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
  TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}

jobs:
  forward:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the CIATA branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
          fetch-depth: 0

      - name: Install test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Run the same checks required by normal PRs
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python -m ruff check .
          python -m pytest -q \
            --ignore=tests/test_player_transport_gui.py \
            --ignore=tests/test_internal_player.py \
            --ignore=tests/test_app_tts.py \
            --deselect tests/test_updater.py::test_update_helper_actually_starts_from_a_path_with_a_space

      - name: Publish the proposal branch and open or update the Forgejo PR
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::FORGEJO_TOKEN secret is not set."
            exit 1
          fi
          if [[ ! "$SOURCE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$SOURCE_BRANCH" == *..* ]]; then
            echo "::error::Invalid source branch name: $SOURCE_BRANCH"
            exit 1
          fi
          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$TARGET_BRANCH" == *..* ]]; then
            echo "::error::Invalid target branch name: $TARGET_BRANCH"
            exit 1
          fi
          if [ "$SOURCE_BRANCH" = "$TARGET_BRANCH" ]; then
            echo "::error::Source and target branches must differ."
            exit 1
          fi

          api="$FORGEJO_BASE/api/v1/repos/$FORGEJO_OWNER/$FORGEJO_REPO"
          proposal_branch="ciata-pr/${SOURCE_BRANCH//\//-}"
          forgejo_host="${FORGEJO_BASE#https://}"
          git remote add forgejo "https://x-access-token:$FORGEJO_TOKEN@$forgejo_host/$FORGEJO_OWNER/$FORGEJO_REPO.git"

          git fetch forgejo \
            "refs/heads/$TARGET_BRANCH:refs/remotes/forgejo/$TARGET_BRANCH"

          if git diff --quiet "refs/remotes/forgejo/$TARGET_BRANCH...HEAD"; then
            echo "No changes to forward from $SOURCE_BRANCH to $TARGET_BRANCH."
            exit 0
          fi

          remote_sha="$(git ls-remote forgejo "refs/heads/$proposal_branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$proposal_branch:$remote_sha" \
              forgejo "HEAD:refs/heads/$proposal_branch"
          else
            git push forgejo "HEAD:refs/heads/$proposal_branch"
          fi

          title="CIATA: forward $SOURCE_BRANCH to $TARGET_BRANCH"
          body="$(cat <<EOF
          Automated proposal from the CIATA fork.

          - Source: \`$SOURCE_BRANCH\`
          - Target: \`$TARGET_BRANCH\`
          - Commit: \`$(git rev-parse HEAD)\`
          - Checks: Ruff and pytest passed on GitHub Actions.

          This workflow only publishes the proposal branch and maintains this PR. It does not merge or publish releases.
          EOF
          )"

          open_prs="$(curl --fail --silent --show-error \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Accept: application/json" \
            "$api/pulls?state=open&base=$(printf '%s' "$TARGET_BRANCH" | jq -sRr @uri)")"
          pr_number="$(jq -r --arg head "$proposal_branch" --arg base "$TARGET_BRANCH" \
            '.[] | select(.head.ref == $head and .base.ref == $base) | .number' <<<"$open_prs" | head -n 1)"

          payload="$(jq -n --arg title "$title" --arg head "$proposal_branch" \
            --arg base "$TARGET_BRANCH" --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}')"

          if [ -n "$pr_number" ]; then
            curl --fail --silent --show-error -X PATCH \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api/pulls/$pr_number" >/dev/null
            echo "Updated Forgejo PR #$pr_number."
          else
            pr_url="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api/pulls" | jq -r '.html_url // empty')"
            [ -n "$pr_url" ] || { echo "::error::Forgejo did not return the new PR URL."; exit 1; }
            echo "Opened Forgejo PR: $pr_url"
          fi
